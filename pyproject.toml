[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "change-analysis"
version = "0.1.0"
description = "СПР change-analysis: normalize, compare, aggregate two strategy slices"
requires-python = ">=3.11"
# pandas/numpy are deliberately absent: the pipeline is the standard library plus SQL
# (grep -rn "import pandas" src/ → пусто).  Versions are the verified set, see
# requirements/cpu.txt.
dependencies = [
    "nicegui==4.0.0",
    "psycopg[binary]==3.3.8",
    "psycopg-pool==3.3.3",
    "jinja2==3.1.6",
    "markupsafe==3.0.4",
    "argon2-cffi==25.1.0",
    "httpx==0.28.1",
]

[project.optional-dependencies]
dev = ["pytest==9.2.0", "pytest-timeout==2.4.0", "playwright==1.56.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
