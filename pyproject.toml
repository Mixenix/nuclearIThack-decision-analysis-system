[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "change-analysis"
version = "0.1.0"
description = "СПР change-analysis: normalize, compare, aggregate two strategy slices"
requires-python = ">=3.11"
dependencies = [
    "nicegui==4.0.0",
    "psycopg[binary]>=3.2",
    "psycopg_pool>=3.2",
    "pandas>=2.0",
    "jinja2>=3.1",
    "argon2-cffi>=23",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
